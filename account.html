<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account — Tally Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card wide">
    <div class="page-header">
      <button id="back" class="icon-button" aria-label="Back to Dashboard"><i class="ph-bold ph-house-line"></i></button>
      <div class="header-title">
        <h1 id="account-name">Account</h1>
        <p id="account-number-line" class="account-meta"></p>
      </div>
      <button id="edit-account" class="sign-out-link">Edit</button>
    </div>
    <div id="status"><div class="spinner"></div></div>
    <div id="account-content" hidden>
      <div id="balance-section"></div>
      <button id="add-transaction">Add Transaction</button>
      <div class="history-heading">
        <h2>History</h2>
        <button id="select-toggle" class="sign-out-link">Select</button>
      </div>
      <div id="selection-bar" class="selection-bar" hidden>
        <span id="selection-count"></span>
        <button id="delete-selected" class="sign-out-link">Delete</button>
        <button id="cancel-selection" class="sign-out-link">Cancel</button>
      </div>
      <div id="undo-banner" class="undo-banner" hidden>
        <span id="undo-text"></span>
        <button id="undo-button" class="sign-out-link">Undo</button>
      </div>
      <p class="hint">Type to search by description or amount. Use the menu to show only inflows or only expenses.</p>
      <div class="history-filters">
        <input type="search" id="history-search" aria-label="Search transactions" placeholder="Search description or amount" />
        <select id="history-type" aria-label="Show transactions">
          <option value="all">All transactions</option>
          <option value="inflow">Inflows only</option>
          <option value="expense">Expenses only</option>
        </select>
      </div>
      <div id="starting-balance-row"></div>
      <div id="history-list"></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>
  <script type="module" src="js/account.js"></script>
</body>
</html>
