<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account — Tally Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card wide">
    <div class="page-header">
      <button id="back" class="icon-button" aria-label="Back to Dashboard"><i class="ph-fill ph-arrow-left"></i></button>
      <div class="header-title">
        <h1 id="account-name">Account</h1>
        <p id="account-number-line" class="account-meta"></p>
      </div>
      <button id="edit-account" class="sign-out-link">Edit</button>
    </div>
    <div id="status"><div class="spinner"></div></div>
    <div id="account-content" hidden>
      <div id="balance-section"></div>
      <button id="add-transaction">Add Transaction</button>
      <h2>History</h2>
      <div id="history-list"></div>
    </div>
  </div>
  <script type="module" src="js/account.js"></script>
</body>
</html>
