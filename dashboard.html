<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Tally Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="card wide">
    <div class="page-header">
      <h1>Tally Up</h1>
      <button id="sign-out" class="sign-out-link">Sign Out</button>
    </div>
    <div id="status"><div class="spinner"></div></div>
    <div id="content"></div>
    <button id="add-transaction">Add Transaction</button>
    <button id="add-account" class="secondary">Add Account</button>
    <button id="export" class="secondary">Export to Excel</button>
    <p class="error" id="export-status"></p>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
