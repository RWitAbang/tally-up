<svg width="680" height="190" viewBox="0 0 680 190" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
<title>How Tally Up's three pieces connect</title>
<desc>Netlify serves the app's files to your browser, which then reads and writes data directly with Supabase.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#37505C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="80" width="140" height="56" rx="8" fill="#EDEFF0" stroke="#9AA5AA" stroke-width="0.5"/>
<text x="110" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1F2A2E">Netlify</text>
<text x="110" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4A5558">Hosts the files</text>

<rect x="240" y="80" width="160" height="56" rx="8" fill="#E4F3FB" stroke="#05B2DC" stroke-width="0.5"/>
<text x="320" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#043C4A">Your browser</text>
<text x="320" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0A5A6B">Runs all the logic</text>

<rect x="460" y="80" width="160" height="56" rx="8" fill="#E3F3EC" stroke="#70B77E" stroke-width="0.5"/>
<text x="540" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1E4028">Supabase</text>
<text x="540" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2E5C3C">Database + sign-in</text>

<line x1="180" y1="108" x2="240" y2="108" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="104" x2="460" y2="104" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="112" x2="400" y2="112" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210" y="160" text-anchor="middle" font-size="12" fill="#4A5558">serves the files</text>
<text x="430" y="160" text-anchor="middle" font-size="12" fill="#4A5558">reads and writes rows</text>
</svg>
