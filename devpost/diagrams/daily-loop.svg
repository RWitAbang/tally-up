<svg width="680" height="350" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
<title>Using Tally Up day to day</title>
<desc>The dashboard shows computed totals; adding, editing, or deleting updates one row in Supabase, and the dashboard re-fetches fresh data afterward. Exporting reads the same data but never writes anything.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#37505C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="80" y="30" width="220" height="56" rx="8" fill="#E3F3EC" stroke="#70B77E" stroke-width="0.5"/>
<text x="190" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1E4028">Dashboard</text>
<text x="190" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2E5C3C">Shows your totals</text>

<rect x="380" y="30" width="220" height="56" rx="8" fill="#EDEFF0" stroke="#9AA5AA" stroke-width="0.5"/>
<text x="490" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1F2A2E">Export to Excel</text>
<text x="490" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4A5558">No write, just reads</text>

<rect x="80" y="140" width="220" height="56" rx="8" fill="#E4F3FB" stroke="#05B2DC" stroke-width="0.5"/>
<text x="190" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#043C4A">Add, edit, or delete</text>
<text x="190" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0A5A6B">A transaction or account</text>

<rect x="80" y="250" width="220" height="56" rx="8" fill="#E3F3EC" stroke="#70B77E" stroke-width="0.5"/>
<text x="190" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1E4028">Supabase updates</text>
<text x="190" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2E5C3C">One row changes</text>

<line x1="190" y1="86" x2="190" y2="140" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="196" x2="190" y2="250" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="300" y1="58" x2="380" y2="58" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="76" text-anchor="middle" font-size="12" fill="#4A5558">any time</text>
<text x="190" y="326" text-anchor="middle" font-size="12" fill="#4A5558">↻ dashboard re-fetches fresh data</text>
</svg>
