<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
<title>Getting into Tally Up</title>
<desc>Opening the app checks for a signed-in session with Supabase; without one you see the sign-in screen, otherwise the dashboard loads.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#37505C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="100" y="30" width="160" height="44" rx="8" fill="#EDEFF0" stroke="#9AA5AA" stroke-width="0.5"/>
<text x="180" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1F2A2E">Open the app</text>

<rect x="100" y="110" width="160" height="56" rx="8" fill="#E3F3EC" stroke="#70B77E" stroke-width="0.5"/>
<text x="180" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1E4028">Check sign-in</text>
<text x="180" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2E5C3C">Ask Supabase</text>

<rect x="360" y="110" width="200" height="56" rx="8" fill="#E4F3FB" stroke="#05B2DC" stroke-width="0.5"/>
<text x="460" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#043C4A">Sign-in screen</text>
<text x="460" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0A5A6B">Email and password</text>

<rect x="100" y="220" width="160" height="56" rx="8" fill="#E3F3EC" stroke="#70B77E" stroke-width="0.5"/>
<text x="180" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1E4028">Load dashboard</text>
<text x="180" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2E5C3C">Fetch your data</text>

<line x1="180" y1="74" x2="180" y2="110" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260" y1="138" x2="360" y2="138" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="124" text-anchor="middle" font-size="12" fill="#4A5558">no</text>
<line x1="180" y1="166" x2="180" y2="220" stroke="#37505C" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="193" text-anchor="start" font-size="12" fill="#4A5558">yes</text>
<text x="460" y="190" text-anchor="middle" font-size="12" fill="#4A5558">↻ back to check sign-in</text>
</svg>
