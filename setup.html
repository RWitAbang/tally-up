<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Account — Tally Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card">
    <h1 id="page-title">Add an Account</h1>
    <p id="welcome-desc" class="welcome-desc" hidden>Helping you track all your accounts, transactions, and balances in one place — let's start with your first one!</p>
    <div id="status"></div>
    <div id="form-section">
      <form id="setup-form">
        <label for="bank_name">Bank Name</label>
        <input type="text" id="bank_name" name="bank_name" required />

        <label for="account_number">Account Number (optional)</label>
        <input type="text" inputmode="numeric" id="account_number" name="account_number" placeholder="e.g. 0123456789" />

        <label for="account_type">Account Type</label>
        <select id="account_type" name="account_type">
          <option value="savings">Savings</option>
          <option value="current">Current</option>
          <option value="domiciliary">Domiciliary</option>
          <option value="utility_card">Utility Card</option>
          <option value="domiciliary_card">Domiciliary Card</option>
        </select>

        <label for="currency">Currency</label>
        <select id="currency" name="currency">
          <option value="NGN">Naira (₦)</option>
          <option value="USD">Dollar ($)</option>
          <option value="GBP">Pound (£)</option>
        </select>

        <label for="category">Personal or Business</label>
        <select id="category" name="category">
          <option value="personal">Personal</option>
          <option value="business">Business</option>
        </select>

        <label for="starting_balance">Starting Balance</label>
        <div class="amount-field">
          <span class="amount-symbol" id="balance-symbol">₦</span>
          <input type="text" inputmode="decimal" id="starting_balance" name="starting_balance" placeholder="0.00" />
        </div>
        <p class="hint" id="balance-locked-hint" hidden>Locked because this account already has transactions — changing it now would throw off every balance calculated since.</p>
        <p class="error" id="balance-error"></p>

        <button type="submit" id="save-button">Save Account</button>
        <button type="button" id="delete-account" class="secondary" hidden>Delete Account</button>
        <button type="button" id="cancel" class="secondary" hidden>Cancel</button>
        <p class="error" id="error"></p>
      </form>
    </div>
    <div id="confirm-section" hidden>
      <p>Account added!</p>
      <button id="done">Done! — go to Dashboard</button>
      <button id="add-transaction-now" class="secondary">Add a transaction to this account</button>
      <button id="add-another" class="secondary">Add another account</button>
    </div>
  </div>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
